[project]
name = "college-bus-ml-service"
version = "0.1.0"
description = "Optional demand prediction service"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pandas",
  "numpy",
  "scikit-learn",
  "httpx",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
