services:
  db:
    image: postgres:16
    container_name: cbc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: college_bus
    ports:
      - "5432:5432"
    volumes:
      - cbc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d college_bus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cbc_pgdata:
