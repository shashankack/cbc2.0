[project]
name = "college-bus-backend"
version = "0.1.0"
description = "Core FastAPI backend for the college bus allocation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "pg8000",
  "email-validator",
  "dnspython",
  "httpx",
  "python-dotenv",
  "python-multipart",
  "openpyxl",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
